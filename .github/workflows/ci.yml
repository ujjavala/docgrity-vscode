name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile (strict TypeScript)
        run: npm run compile
      - name: Unit tests
        run: npm test
      - name: Action unit tests (zero-dependency, node:test)
        working-directory: action
        run: npm test
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Secret pattern scan (source only)
        run: |
          ! grep -rInE "(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})" src/ action/src/ action/bin/ \
            && echo "No hardcoded credentials found."
      - name: Package extension
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: docgrity-vsix
          path: '*.vsix'

  # NOTE: CodeQL code scanning requires a public repo or GitHub Advanced Security.
  # If this repo is ever made public, restore a codeql job with
  # `security-events: write` and github/codeql-action init + analyze.
